name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm EditeurPDF.spec

      - name: Build installer with Inno Setup
        run: iscc setup.iss

      # The app refuses to run an installer it cannot verify, so the release body
      # must carry the hash. Generated notes are appended to this body by GitHub.
      - name: Compute installer SHA-256
        id: hash
        run: |
          $h = (Get-FileHash installer_output/InstallEditeurPDF.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/InstallEditeurPDF.exe
          generate_release_notes: true
          body: |
            SHA256: ${{ steps.hash.outputs.sha256 }}
